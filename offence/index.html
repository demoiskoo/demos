<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Palantir Mini: Student Offence Dashboard Demo · v0.4</title>
</head>
<body>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
/* Palantir Mini: Student Offence Dashboard Demo v0.4 (15 Oct 2026; v0.4 = Koo's name for the app, as on its Gallery page; v0.3 = the footer links to its own Gallery page) - a phone-sized trial of Palantir: Offence Dashboard v0.6.9 for
   the NLC Group D poster. Made-up data from a fixed seed; nothing is fetched or sent.
   v0.2 = v0.1's design, data, words and logic, made to feel like a phone app: swipe the headline numbers to change the
   year, the panel is a bottom sheet (drag down to close, swipe right to go back), and a long press on a row peeks.
   DESIGN TOKENS: every colour, size, radius and duration lives here (copied from the real app); nothing below uses a literal. */
:root{
  color-scheme:light;
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f1f2f7; --border:#e3e5ea; --border-strong:#cfd3dc;
  --text:#1f2937; --text-muted:#5b6474; --text-subtle:#6b7385;
  --brand:#1565c0; --brand-soft:#e3eefb; --brand-ink:#0d47a1; --on-brand:#ffffff;
  --badge-1:#1565c0; --badge-2:#6a1b9a; --badge-ink:#ffffff; --pill-bg:#eef2ff; --pill-ink:#3949ab;
  --heat-1:#e8f1fb; --heat-2:#c9dcf4; --heat-3:#94bbe8; --heat-4:#2f74c8; --heat-ink-4:#ffffff;
  /* an offence's seriousness (MOE): minor hollow, serious orange, very serious red; a blue ring for a police case */
  --dot-minor:#8a92a1; --dot-serious:#e08a3c; --dot-very:#c8414c; --dot-police:#1e40af;
  --scrim:rgba(15,23,42,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 6px 24px rgba(31,41,55,.18);
  --radius:10px; --radius-sm:6px; --gap:12px; --gutter:16px; --tap:44px; --maxw:560px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:28px;
  /* phone feel: the gap between year panels (a sliver of the next one shows), a one-time hint, motion */
  --peek-gap:8px; --hint-bg:rgba(31,41,55,.92); --hint-ink:#ffffff;
  --t-fast:.15s; --t-in:.28s; --t-out:.22s; --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15161c; --surface:#1d1f27; --surface-2:#252833; --border:#30333f; --border-strong:#3e4252;
    --text:#e7e8ee; --text-muted:#a7adbb; --text-subtle:#8d93a3;
    --brand:#90c2f5; --brand-soft:#17283f; --brand-ink:#a9d0f8; --on-brand:#0b1a2e;
    --pill-bg:#232a4a; --pill-ink:#b4bff5;
    --heat-1:#172a42; --heat-2:#1e3d62; --heat-3:#285689; --heat-4:#3a75bd; --heat-ink-4:#ffffff;
    --dot-minor:#8d93a3; --dot-serious:#f0a65e; --dot-very:#ef5b62; --dot-police:#9db8ff;
    --scrim:rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 24px rgba(0,0,0,.55);
    --hint-bg:rgba(231,232,238,.94); --hint-ink:#15161c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15161c; --surface:#1d1f27; --surface-2:#252833; --border:#30333f; --border-strong:#3e4252;
  --text:#e7e8ee; --text-muted:#a7adbb; --text-subtle:#8d93a3;
  --brand:#90c2f5; --brand-soft:#17283f; --brand-ink:#a9d0f8; --on-brand:#0b1a2e;
  --pill-bg:#232a4a; --pill-ink:#b4bff5;
  --heat-1:#172a42; --heat-2:#1e3d62; --heat-3:#285689; --heat-4:#3a75bd; --heat-ink-4:#ffffff;
  --dot-minor:#8d93a3; --dot-serious:#f0a65e; --dot-very:#ef5b62; --dot-police:#9db8ff;
  --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 24px rgba(0,0,0,.55);
  --hint-bg:rgba(231,232,238,.94); --hint-ink:#15161c;
}
*{box-sizing:border-box}
html.locked{overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-md)/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}   /* a press shows as :active below, not the grey flash */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:max(var(--gutter),env(safe-area-inset-left,0px))}
.n,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}

/* ---- top bar: series branding ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.topbar .wrap{padding-block:10px}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.brand-icon{width:28px;height:28px;flex:none;border-radius:7px;background:linear-gradient(135deg,var(--badge-1),var(--badge-2));color:var(--badge-ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.brand-sep{color:var(--text-subtle);font-weight:400}
.brand-sub{color:var(--text-muted);font-weight:500;font-size:13.5px}
.brand-version{font-size:10.5px;background:var(--pill-bg);color:var(--pill-ink);padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.02em}

/* ---- the strip under the bar ---- */
.notice{margin:12px 0 0;padding:7px 12px;border-radius:var(--radius-sm);background:var(--brand-soft);color:var(--brand-ink);font-size:var(--fs-sm)}
.seg{position:relative;z-index:1;display:flex;margin-top:12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);user-select:none;-webkit-user-select:none}
.seg button{flex:1;min-width:0;min-height:var(--tap);border:0;border-left:1px solid var(--border-strong);background:none;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--brand);color:var(--on-brand);font-weight:700}
.seg button:focus-visible{outline-offset:-3px}

/* ---- the headline: one panel a year, side by side; a swipe (or the switcher above, or ← →) moves between them ---- */
.swipe-wrap{position:relative;margin-top:-4px}
.swipe{display:flex;gap:var(--peek-gap);align-items:flex-start;margin-inline:calc(-1 * var(--gutter));overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);overscroll-behavior-x:contain;scrollbar-width:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:height var(--t-out) ease}
.swipe::-webkit-scrollbar{display:none}
.swipe::before,.swipe::after{content:"";flex:0 0 calc(var(--gutter) - var(--peek-gap))}   /* the outer gutters, as items: every browser keeps them */
.yp{flex:0 0 calc(100% - 2 * var(--gutter));min-width:0;padding:8px 0 4px;scroll-snap-align:start;scroll-snap-stop:always}
.yp .cap{margin-top:0}
.swipe.nudge .yp{animation:nudge 1.4s var(--ease-out) .2s}
@keyframes nudge{0%,100%{transform:none}35%{transform:translateX(36px)}}
.cap{margin:4px 0 0;color:var(--text-muted);font-size:var(--fs-sm);display:flex;align-items:center;flex-wrap:wrap}
.info{border:0;background:none;color:var(--text-subtle);cursor:pointer;min-width:var(--tap);min-height:var(--tap);margin:-8px -10px -8px -6px;padding:0;font-size:15px}
.info[aria-expanded="true"]{color:var(--brand-ink)}
.infonote{margin:0 0 4px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-muted);font-size:var(--fs-sm)}

/* ---- shared shapes: box, card ---- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;min-height:var(--tap);padding:12px 26px 12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);cursor:pointer}
.kpi b{font-size:var(--fs-xl);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--text-muted);font-size:var(--fs-sm);line-height:1.35;margin-top:2px}
.kpi em{font-style:normal;color:var(--text-muted);font-size:var(--fs-xs);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi::after{content:"\203A";position:absolute;top:8px;right:12px;font-size:22px;line-height:1;color:var(--text-subtle)}   /* opens a list */
.kpi:disabled{cursor:default}.kpi:disabled::after{content:none}
.card{margin-top:var(--gap);padding:14px 14px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);min-width:0}
.card h2{margin:0;font-size:var(--fs-lg);line-height:1.3}
.card .sub{display:block;margin:2px 0 8px;color:var(--text-subtle);font-size:var(--fs-xs)}
.empty{padding:16px 0;color:var(--text-muted);text-align:center;margin:0}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--text-muted);margin:10px 0 0}
.legend .dot{margin-right:5px;vertical-align:0}
.legend .dot.pol{margin:0 8px 0 3px}

/* ---- seriousness dots (the real app's) ---- */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--dot-serious)}
.dot.minor{background:none;box-shadow:inset 0 0 0 1.5px var(--dot-minor)}
.dot.very{background:var(--dot-very)}
.dot.pol{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--dot-police)}
.dot.minor.pol{box-shadow:inset 0 0 0 1.5px var(--dot-minor),0 0 0 2px var(--surface),0 0 0 3.5px var(--dot-police)}
.dot.ring{background:none}

/* ---- Top 5: a row is one button ---- */
.t5{display:grid;grid-template-columns:30px minmax(0,1fr) 54px 38px 50px;gap:6px;align-items:center;width:100%;min-height:var(--tap);padding:6px 2px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left}
.t5.show{grid-template-columns:30px minmax(0,1fr) 52px 52px}
button.t5{cursor:pointer}
button.t5,.stu{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}   /* a long press peeks, so no text selection or callout */
.t5.h{min-height:0;padding-top:2px;color:var(--text-muted);font-size:var(--fs-xs);font-weight:600;border-bottom-color:var(--border-strong)}
.t5 .rk{text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums;padding-right:2px}
.t5 .r{text-align:right;font-variant-numeric:tabular-nums}
.t5 .nmk{display:flex;align-items:baseline;gap:7px;min-width:0;line-height:1.3}
.t5 .nmk span{color:var(--brand-ink);font-weight:600}
.t5 small{color:var(--text-subtle);font-size:var(--fs-xs);margin-left:3px}
.chg{color:var(--text-muted);font-size:var(--fs-sm);white-space:nowrap}
.gone{margin:8px 0 0;color:var(--text-subtle);font-size:var(--fs-xs)}

/* ---- Offence by level: a table; a count is a button ---- */
.pickwrap{position:relative;margin:2px 0 10px}
.pick{appearance:none;-webkit-appearance:none;width:100%;min-height:var(--tap);padding:0 40px 0 12px;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);cursor:pointer}
.pickwrap .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted);font-size:12px}
.scroll{overflow-x:auto;overscroll-behavior-x:contain}   /* on a narrow phone the table scrolls in its own box */
table.t{width:100%;min-width:300px;border-collapse:collapse;table-layout:fixed;font-size:var(--fs-sm)}
table.t col.c{width:40px}
table.t col.a{width:44px}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:0;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
table.t thead th{color:var(--text-muted);font-size:var(--fs-xs);font-weight:600;padding:4px 2px 6px;border-bottom-color:var(--border-strong)}
table.t th.o{text-align:left;font-weight:500;padding:6px 6px 6px 2px;line-height:1.3;color:var(--text)}
table.t thead th.o{color:var(--text-muted);font-weight:600}
table.t th.o .dot{margin-right:6px}
table.t .gs{border-left:2px solid var(--border-strong)}
table.t tr.pin th,table.t tr.pin td{font-weight:700;border-top:2px solid var(--border-strong)}
.h1{background:var(--heat-1)}.h2{background:var(--heat-2)}.h3{background:var(--heat-3)}.h4{background:var(--heat-4);color:var(--heat-ink-4)}   /* heat(): the table and the level strip */
.cb{display:block;width:100%;min-height:var(--tap);border:0;background:none;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:inherit;color:inherit}

/* ---- one offence's count by level: the long-press peek and the top of its panel ---- */
.lvls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 6px}
.lvls span{display:flex;flex-direction:column;align-items:center;min-width:0;padding:5px 0 6px;border-radius:var(--radius-sm);line-height:1.25}
.lvls .h0{background:var(--surface-2)}
.lvls i{font-style:normal;font-size:var(--fs-xs);color:var(--text-muted)}
.lvls .h4 i{color:inherit}
.lvls b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums}

/* ---- students: a row is one button; a year's cell = the class that year, the count, a dot per offence ---- */
.years{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:start}
.years.hd{margin:10px 0 2px;padding:0 2px}
.years.hd span{font-size:var(--fs-xs);color:var(--text-muted);font-weight:600;font-variant-numeric:tabular-nums}
.years.hd span.sel{color:var(--brand-ink)}
.yc{display:flex;flex-direction:column;gap:2px;min-width:0}
.yc b{display:flex;align-items:baseline;gap:5px;height:23px;font-size:var(--fs-xs);color:var(--text-subtle);font-weight:600;white-space:nowrap}
.yc b span{overflow:hidden;text-overflow:ellipsis}
.yc em{font-style:normal;font-weight:700;font-size:var(--fs-md);color:var(--text);font-variant-numeric:tabular-nums}
.yc em.zero{color:var(--text-subtle);font-weight:400}
.yc .l{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-height:29px;padding:5px;border-radius:4px;background:var(--surface-2)}
.yc.out .l{background:none;box-shadow:inset 0 0 0 1px var(--border)}
.yc.sel .l{box-shadow:inset 0 0 0 2px var(--brand)}
.yc .dot{width:7px;height:7px}
.yc .dot.pol{box-shadow:0 0 0 1px var(--surface-2),0 0 0 2px var(--dot-police)}
.yc .dot.minor.pol{box-shadow:inset 0 0 0 1.5px var(--dot-minor),0 0 0 1px var(--surface-2),0 0 0 2px var(--dot-police)}
.yc .more{font-size:10px;line-height:7px;color:var(--text-muted)}
.stu{display:block;width:100%;padding:10px 2px 12px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer}
.stu .nm{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.stu .nm b{color:var(--brand-ink);font-weight:600}
.stu .nm i{margin-left:auto;font-style:normal;font-size:20px;line-height:1;color:var(--text-subtle)}
.more-btn{display:block;width:100%;min-height:var(--tap);margin-top:8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--brand-ink);font-weight:600;cursor:pointer}

/* ---- footer ---- */
.foot{padding-block:20px calc(40px + env(safe-area-inset-bottom,0px))}
.foot .card{background:var(--brand-soft);border-color:var(--brand-soft);box-shadow:none}
.foot p{margin:6px 0 0;font-size:var(--fs-sm)}
.go{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);margin-top:12px;padding:0 16px;border-radius:var(--radius-sm);background:var(--brand);color:var(--on-brand);font-weight:600;text-decoration:none}

/* ---- the panel: the cases behind a number, or one student's record ---- */
/* on a phone a bottom sheet: it slides up, a drag on the handle (or on the list when it is at the top) pulls it down,
   and a swipe right steps back to the list it was opened from. On a wide screen a drawer from the right. */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);touch-action:none;transition:opacity var(--t-out) ease}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 28px);z-index:41;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow-md);transition:transform var(--t-out) var(--ease-out)}
.sheet.enter{animation:sheetUp var(--t-in) var(--ease-out)}
.scrim.enter{animation:fade var(--t-in) ease-out}
.sheet.leave{transform:translateY(100%)!important;transition:transform var(--t-out) var(--ease-in)}
.scrim.leave{opacity:0!important}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetSide{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{flex:none;display:flex;justify-content:center;align-items:center;height:20px;touch-action:none;cursor:grab}
.grab span{width:36px;height:5px;border-radius:3px;background:var(--border-strong)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;transition:transform var(--t-out) var(--ease-out)}
.pane.push{animation:fromR var(--t-out) var(--ease-out)}
.pane.pop{animation:fromL var(--t-out) var(--ease-out)}
@keyframes fromR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fromL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.sheet.dragging,.pane.dragging{transition:none}
.sheet header{display:flex;align-items:flex-start;gap:4px;padding:0 4px 8px 16px;border-bottom:1px solid var(--border);touch-action:none}
.sheet header.has-back{padding-left:4px}
.sheet h2{flex:1;min-width:0;margin:0;padding-top:9px;font-size:var(--fs-lg);line-height:1.3}
.sheet h2:focus{outline:none}
.sheet h2 .sub{display:block;margin-top:2px;color:var(--text-muted);font-size:var(--fs-sm);font-weight:400}
.x,.back{flex:none;width:var(--tap);height:var(--tap);border:0;border-radius:var(--radius-sm);background:none;color:var(--text-muted);font-size:24px;line-height:1;cursor:pointer}
.sheet .body{flex:1;overflow:auto;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){
  .sheet{top:0;left:auto;width:480px;border-radius:0}
  .sheet.enter{animation-name:sheetSide}
  .sheet.leave{transform:translateX(100%)!important}
  .grab{display:none}
  .sheet header{padding-top:8px}
}

/* ---- the long-press peek: a small card by the row; letting go closes it ---- */
.peek{position:fixed;z-index:30;padding:10px 14px 12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-md);pointer-events:none;animation:pop var(--t-fast) var(--ease-out)}
.peek .pk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.peek .pk-h b{font-size:var(--fs-lg)}
.peek .pk-h span{color:var(--text-muted);font-size:var(--fs-sm)}
.peek p{margin:6px 0 0;font-size:var(--fs-sm);line-height:1.45}
.peek .lvls{margin-bottom:0}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.held{background:var(--surface-2)!important;box-shadow:inset 0 0 0 2px var(--brand)}

/* ---- a one-time hint for a gesture; it fades after 4 seconds or the first try ---- */
.hint-host{position:relative}
.hint{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--hint-bg);color:var(--hint-ink);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;box-shadow:var(--shadow-md);pointer-events:none;animation:fade var(--t-in) ease-out;transition:opacity .3s ease}
.hint.out{opacity:0}
.swipe-wrap .hint{top:calc(50% + 12px)}
.case{padding:10px 0;border-bottom:1px solid var(--border)}
.case .top{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:baseline}
.case .date{color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:46px}
.case .off{font-weight:600}
.case .off .dot{margin-right:6px}
.tag{display:inline-block;font-size:var(--fs-xs);padding:1px 7px;border-radius:9px;background:var(--surface-2);color:var(--text-muted)}
.acts{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:var(--fs-sm);color:var(--text-muted)}
.acts b{color:var(--text);font-weight:600}

/* ---------- 2. the top 5 offences, ranked as SPF and MOE report them; ties at fifth all stay ---------- */
function ranked(v) {
  const by = {};
  v.forEach(function (o) { (by[o.base] = by[o.base] || []).push(o); });
  const keys = Object.keys(by).sort(function (a, b) { return by[b].length - by[a].length || (a < b ? -1 : 1); }), rank = {};
  keys.forEach(function (k, i) { rank[k] = i && by[k].length === by[keys[i - 1]].length ? rank[keys[i - 1]] : i + 1; });

}
function topFive(v, a, w, pw) {
  const R = ranked(v), top = R.keys.filter(function (k) { return R.rank[k] <= TOP_N; });
  if (!top.length) { return ''; }
  const open = function (k) { return reg({ kind: 'cases', title: esc(nm(k)), sub: w.say + ' &middot; ' + plural(R.by[k].length, 'offence'), list: R.by[k], lv: true }); };
  const name = function (k) { return '<span class="nmk">' + kindDot(R.by[k][0]) + '<span>' + nmH(k) + '</span></span>'; };

      top.map(function (k) {

        return '<button type="button" class="t5" data-act="open" data-id="' + open(k) + '" aria-label="' + esc(nm(k)) + ': ' + b + ' in ' + w.label + ', ' + l + ' in ' + pw.label + '">' +
          '<span class="rk">' + R.rank[k] + '</span>' + name(k) + '<span class="r muted">' + l + (l ? '<small>#' + L.rank[k] + '</small>' : '') + '</span><span class="r"><b>' + b + '</b></span><span class="r chg">' + deltaShort(b, l) + '</span></button>';
      }).join('');
    const gone = L.keys.filter(function (k) { return L.rank[k] <= TOP_N && top.indexOf(k) < 0; });
    if (gone.length) { h += '<p class="gone">Also in ' + pw.label + '&rsquo;s top ' + TOP_N + ': ' + gone.map(function (k) { return nmH(k) + ' (#' + L.rank[k] + ', ' + L.by[k].length + ')'; }).join(', ') + '</p>'; }

}

/* ---------- 3. offence by level, for one MOE seriousness or one group ---------- */
function byLevel(v, w) {
  const pk = S.pick.split(':'), mine = function (o) { return pk[0] === 'sev' ? o.sev === pk[1] : o.grp === pk[1]; };
  const l = v.filter(mine);
  const opt = function (val, label) { return '<option value="' + esc(val) + '"' + (S.pick === val ? ' selected' : '') + '>' + esc(label) + '</option>'; };
  const pick = '<div class="pickwrap"><select class="pick" data-act="pick" aria-label="Offences to show">' +
    '<optgroup label="By MOE seriousness">' + SEV_ORDER.map(function (s) { return opt('sev:' + s, SEV[s] + ' offences'); }).join('') + '</optgroup>' +
    '<optgroup label="By group">' + GROUPS.map(function (g) { return opt('grp:' + g, g); }).join('') + '</optgroup></select><span class="chev" aria-hidden="true">&#9662;</span></div>';
  if (!l.length) { return card('Offence by level', STRINGS.tapNumber, pick + '<p class="empty">None in ' + w.label + '.</p>'); }
  const offs = {};
  l.forEach(function (o) { (offs[o.base] = offs[o.base] || []).push(o); });
  const keys = Object.keys(offs).sort(function (a, b) { return offs[b].length - offs[a].length || (a < b ? -1 : 1); });
  let mx = 1;
  keys.forEach(function (k) { [1, 2, 3, 4].forEach(function (lv) { mx = Math.max(mx, offs[k].filter(function (o) { return o.level === lv; }).length); }); });
  const cell = function (list, title, cls) {

    return '<td class="' + (cls || '') + '"><button type="button" class="cb" data-act="open" data-id="' + reg({ kind: 'cases', title: title, sub: w.say + ' &middot; ' + plural(list.length, 'offence'), list: list }) + '" aria-label="' + esc(title.replace(/&middot;/g, ',')) + ': ' + list.length + '">' + list.length + '</button></td>';
  };
  const across = function (list, name, shade) {
    return [1, 2, 3, 4].map(function (lv) { const ll = list.filter(function (o) { return o.level === lv; }); return cell(ll, name + ' &middot; Sec ' + lv, shade ? heat(ll.length, mx) : ''); }).join('') + cell(list, name + ' &middot; all levels', 'gs');
  };
  const rows = keys.map(function (k) { return '<tr><th scope="row" class="o">' + kindDot(offs[k][0]) + nmH(k) + '</th>' + across(offs[k], esc(nm(k)), true) + '</tr>'; }).join('');
  const allName = pk[0] === 'sev' ? SEV[pk[1]] + ' offences' : esc(pk[1]);

    '<thead><tr><th scope="col" class="o">Offence</th><th scope="col">Sec 1</th><th scope="col">Sec 2</th><th scope="col">Sec 3</th><th scope="col">Sec 4</th><th scope="col" class="gs">All</th></tr></thead>' +
    '<tbody>' + rows + '<tr class="pin"><th scope="row" class="o">All</th>' + across(l, allName, false) + '</tr></tbody></table></div>';
  return card('Offence by level', STRINGS.tapNumber, pick + table);
}
// one offence's count in each level, shaded like the table: the long-press peek of a Top 5 row and the top of its panel
function levelStrip(list) {
  const n = [1, 2, 3, 4].map(function (lv) { return list.filter(function (o) { return o.level === lv; }).length; }), mx = Math.max.apply(null, n.concat(1));
  return '<div class="lvls">' + n.map(function (c, i) { return '<span class="' + (heat(c, mx) || 'h0') + '"><i>Sec ' + (i + 1) + '</i><b>' + c + '</b></span>'; }).join('') + '</div>';
}

/* ---------- 4. students with 3 or more offences in the year; a row opens their record ---------- */
function stats(sid) {
  const s = STU[sid], list = BYSTU[sid], inSchool = s.start + 3 >= LAST;
  const lanes = [];
  for (let y = Math.max(FIRST, s.start); y <= Math.min(LAST, s.start + 3); y++) {
    lanes.push({ y: y, level: y - s.start + 1, cls: s.cls[y - s.start + 1], list: list.filter(function (o) { return o.year === y; }) });
  }
  // actions counted by day, apart from offences (Koo: "7 offences with 12 consequences ... it needs to be very clear")
  const days = {};
  list.forEach(function (o) { const d = days[o.date] = days[o.date] || { step: 0, rest: {}, supp: {} }; d.step = Math.max(d.step, o.dayStep); if (o.dayStep === 4) { d.kind = o.dayKind; }
    o.dayRest.forEach(function (r) { d.rest[r] = 1; }); o.daySupp.forEach(function (r) { d.supp[r] = 1; }); });
  const steps = [0, 0, 0, 0, 0, 0], kinds = {}, rest = {}, supp = {};
  Object.keys(days).forEach(function (k) { const d = days[k]; steps[d.step]++; if (d.step === 4) { kinds[d.kind] = (kinds[d.kind] || 0) + 1; }
    Object.keys(d.rest).forEach(function (r) { rest[r] = (rest[r] || 0) + 1; }); Object.keys(d.supp).forEach(function (r) { supp[r] = (supp[r] || 0) + 1; }); });
  return { sid: sid, label: s.label, list: list, last: list[list.length - 1], inSchool: inSchool, now: inSchool ? s.cls[LAST - s.start + 1] : '', lanes: lanes, steps: steps, kinds: kinds, rest: rest, supp: supp };
}
// the five years for everyone, so a column is a year down the whole list: the class that year and the count on top, then a
// dot per offence, the most serious first, a police case ringed (the real app's Students list)
function yearsHead(sel) { return '<span class="years hd" aria-hidden="true">' + YEARS.map(function (y) { return '<span' + (y === sel ? ' class="sel"' : '') + '>' + y + '</span>'; }).join('') + '</span>'; }
function yearCols(st, sel) {
  const rank = { very: 0, serious: 1, minor: 2 };
  return '<span class="years">' + YEARS.map(function (y) {
    const ln = st.lanes.filter(function (l) { return l.y === y; })[0];
    if (!ln) { return '<span class="yc out" title="' + y + ': not in school"><b></b><span class="l"></span></span>'; }
    const n = ln.list.length, cut = n > YEAR_DOTS ? YEAR_DOTS - 1 : n;

    return '<span class="yc' + (y === sel ? ' sel' : '') + '" title="' + y + ', ' + ln.cls + ': ' + plural(n, 'offence') + '"><b><span>' + ln.cls + '</span><em' + (n ? '' : ' class="zero"') + '>' + n + '</em></b><span class="l">' +
      dots.slice(0, cut).map(function (o) { return sevDot(o); }).join('') + (cut < n ? '<span class="more">+' + (n - cut) + '</span>' : '') + '</span></span>';
  }).join('') + '</span>';
}
function studentList(w) {
  const y = w.y, cnt = {};
  Object.keys(BYSTU).forEach(function (sid) { cnt[sid] = BYSTU[sid].filter(function (o) { return o.date >= w.from && o.date <= w.to; }).length; });
  const ids = Object.keys(cnt).filter(function (sid) { return cnt[sid] >= MANY; }).sort(function (a, b) {
    return cnt[b] - cnt[a] || BYSTU[b].length - BYSTU[a].length || (BYSTU[b][BYSTU[b].length - 1].date > BYSTU[a][BYSTU[a].length - 1].date ? 1 : -1); });
  const title = plural(ids.length, 'student') + ' with ' + MANY + ' or more offences in ' + y;

  }).join('');
  const more = cut ? '<button type="button" class="more-btn" data-act="more" aria-expanded="' + S.all + '">' + (S.all ? 'Show fewer' : 'Show all ' + ids.length + ' students') + '</button>' : '';

}

/* ---------- 5. the page; the year drives everything on it ----------
   The headline (caption and four numbers) is drawn once, one panel a year side by side, so a swipe moves between

        (y === LAST ? '<p class="infonote" id="lag"' + (S.info ? '' : ' hidden') + '>' + STRINGS.lagNote + '</p>' : '') +

function renderRest(swap) {

/* ---------- the panel: opened by a number or a student; closed by the cross, Esc or a tap outside ---------- */
let STACK = [], OPENER = null;
function who(o) { return '<button type="button" class="who" data-act="who" data-v="' + o.sid + '">' + esc(STU[o.sid].label) + '</button> <span class="muted">' + esc(o.cls) + '</span>'; }
function actsHtml(o) {                           // Correct, Restore and Support, kept apart
  const cor = o.actions.filter(stepOf).map(function (a) { return esc(nm(a.a)) + (a.insch ? ' (in school)' : ''); });
  const res = o.actions.filter(restoreOf).map(function (a) { return esc(nm(a.a)); });
  const sup = o.actions.filter(supportOf).map(function (a) { return esc(nm(a.a)); });
  return '<div class="acts"><span><b>' + STRINGS.correct + ':</b> ' + (cor.join(', ') || 'none') + '</span><span><b>' + STRINGS.restore + ':</b> ' + (res.join(', ') || STRINGS.noRestore) + '</span>' +
    (sup.length ? '<span><b>' + STRINGS.support + ':</b> ' + sup.join(', ') + '</span>' : '') + '</div>';
}
function tags(o) { return (o.police ? '<span class="tag">police case</span>' : '') + (o.sameDay ? '<span class="tag">with other offences that day</span>' : ''); }
function caseRow(o, noName, noOffence) {

    (noOffence ? '' : '<span class="off">' + sevDot(o) + nmH(o.base) + '</span>') + tags(o) + '</div>' + actsHtml(o) + '</div>';
}
// a list of offences: grouped by offence when it holds more than one, the most first, each newest first
function byOffence(list) {
  const g = {};
  list.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (o) { (g[o.base] = g[o.base] || []).push(o); });
  const ks = Object.keys(g);
  if (ks.length < 2) { return (g[ks[0]] || []).map(function (o) { return caseRow(o, false, true); }).join(''); }
  return ks.sort(function (a, b) { return g[b].length - g[a].length || (a < b ? -1 : 1); }).map(function (k) {
    return '<div class="grp"><div class="sg"><span>' + kindDot(g[k][0]) + ' ' + nmH(k) + '</span><span class="cnt">' + plural(g[k].length, 'offence') + '</span></div>' + g[k].map(function (o) { return caseRow(o, false, true); }).join('') + '</div>';
  }).join('');
}
// a count of students lists them one by one: the most offences first, each student's offences oldest first
function byStudent(list) {
  const g = studentsOf(list);
  return Object.keys(g).map(function (k) { return g[k].slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }); })
    .sort(function (a, b) { return b.length - a.length || (b[b.length - 1].date > a[a.length - 1].date ? 1 : -1); })
    .map(function (l) { return '<div class="grp"><div class="sg"><span>' + who(l[l.length - 1]) + '</span><span class="cnt">' + plural(l.length, 'offence') + '</span></div>' + l.map(function (o) { return caseRow(o, true, false); }).join('') + '</div>'; }).join('');
}
// one student: the summary keeps offences and actions apart, then the five years, then the record oldest first.
// studentHead and studentSummary also give the long-press peek its words, so the peek and the record always agree.
function studentHead(st) { return { title: esc(st.label), sub: st.inSchool ? esc(st.now) + ' &middot; in school' : 'left school' }; }

  const parts = byLane.map(function (l) { return l.list.length + ' in Sec ' + l.level + (l.y === LAST && st.inSchool ? ' so far' : ''); });
  const sevN = SEV_ORDER.map(function (sv) { const n = list.filter(function (x) { return x.sev === sv; }).length; return n ? n + ' ' + SEV[sv].toLowerCase() : ''; }).filter(Boolean);
  const police = list.filter(function (x) { return x.police; }).length, years = byLane.length;

  const cor = CORR.slice(1).reverse().map(function (x) { const n = x.step === 4 ? st.kinds[x.k.charAt(1)] : st.steps[x.step]; return n ? x.say + ' ' + days(n) : ''; }).filter(Boolean);
  const res = Object.keys(st.rest).sort(function (a, b) { return st.rest[b] - st.rest[a]; }).map(function (r) { return r.toLowerCase() + ' ' + days(st.rest[r]); });

    lines: '<p><b>' + STRINGS.correct + ':</b> ' + (cor.length ? join(cor) : 'none recorded') + '.</p><p><b>' + STRINGS.restore + ':</b> ' + (res.length ? join(res) : STRINGS.noRestore) + '.</p>' +
      (sup.length ? '<p><b>' + STRINGS.support + ':</b> ' + join(sup) + '.</p>' : ''),
    clean: st.inSchool ? 'Clean for ' + clean + ', since ' + fmtDate(o.date) + '.' : 'Left school; the last offence was on ' + fmtDate(o.date) + '.',
    byLane: byLane

}
function studentView(sid) {

      l.list.map(function (x) { return '<li class="case">' + sevDot(x) + '<div class="top"><span class="date">' + fmtShort(x.date) + '</span><span class="off">' + nmH(x.base) + '</span>' + tags(x) + '</div>' + actsHtml(x) + '</li>'; }).join('') + '</ol>';
  }).join('');

function viewHtml(v) {

  return { title: v.title, sub: v.sub, body: (v.lv ? levelStrip(v.list) : '') + ((v.by === 'student' ? byStudent(v.list) : byOffence(v.list)) || '<p class="empty">None.</p>') };
}

/* ---------- motion and device: read once; durations come from the CSS tokens ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)'), WIDE = matchMedia('(min-width: 720px)'), COARSE = matchMedia('(pointer: coarse)'), FINE = matchMedia('(hover: hover) and (pointer: fine)');
function REDUCED() { return RM.matches; }
const T_OUT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-out')) * 1000 || 220;

/* ---------- the panel: a bottom sheet on a phone, a drawer on a wide screen ----------
   Opened by a number or a student. Closed by the cross, Esc, a tap outside, or a drag down. A student opened from a
   list inside it slides in on top; the back arrow, a swipe right or ← returns to the list where it was. */
const panel = document.getElementById('panel'), app = document.getElementById('app');
let closing = false;
function drawPanel(how) {                        // how: 'enter' (opened), 'push' (a student from the list), 'pop' (back)

    '<div class="grab" aria-hidden="true"><span></span></div><div class="pane' + (how === 'push' || how === 'pop' ? ' ' + how : '') + '">' +
    '<header' + (STACK.length > 1 ? ' class="has-back"><button type="button" class="back" data-act="back" aria-label="Back">&#8592;</button>' : '>') +
    '<h2 id="ptitle" tabindex="-1">' + r.title + '<span class="sub">' + r.sub + '</span></h2><button type="button" class="x" data-act="close" aria-label="Close">&times;</button></header>' +
    '<div class="body">' + r.body + '</div></div></section>';

}

  OPENER = opener;
  document.querySelectorAll('.is-open').forEach(function (x) { x.classList.remove('is-open'); });
  if (opener) { opener.classList.add('is-open'); }
  drawPanel('enter');
}
function pushStudent(sid) {
  STACK[STACK.length - 1].scroll = panel.querySelector('.body').scrollTop;
  STACK.push({ kind: 'student', sid: sid });
  drawPanel('push');
}
function goBack() { if (STACK.length > 1) { STACK.pop(); drawPanel('pop'); } }
function closePanel(now) {                       // now: the sheet has already been dragged away
  if (!STACK.length || closing) { return; }
  const done = function () {
    closing = false;
    STACK = [];
    drawPanel();
    if (OPENER && document.contains(OPENER)) { OPENER.focus({ preventScroll: true }); }
    OPENER = null;
  };
  if (now || REDUCED()) { done(); return; }
  closing = true;
  const sheet = panel.querySelector('.sheet');
  sheet.classList.remove('enter');
  sheet.classList.add('leave');
  panel.querySelector('.scrim').classList.add('leave');
  setTimeout(done, T_OUT);
}
// the sheet follows the finger: down (from the handle or header, or from the list when it is at the top) closes it;
// right steps back, or on a wide screen closes the drawer. Anything else is left to the list's own scrolling.
let drag = null;
panel.addEventListener('touchstart', function (e) {
  drag = null;
  const sheet = e.target.closest && e.target.closest('.sheet');
  if (!sheet || closing || e.touches.length !== 1) { return; }
  const t = e.touches[0], body = sheet.querySelector('.body');
  drag = { x: t.clientX, y: t.clientY, mode: '', sheet: sheet, pane: sheet.querySelector('.pane'), body: body, inBody: body.contains(e.target), last: 0, lt: e.timeStamp, v: 0 };
}, { passive: true });
panel.addEventListener('touchmove', function (e) {
  if (e.target.closest && e.target.closest('.scrim')) { e.preventDefault(); return; }   // the page behind never scrolls
  const d = drag;
  if (!d || d.mode === 'no' || e.touches.length !== 1) { return; }
  const t = e.touches[0], dx = t.clientX - d.x, dy = t.clientY - d.y;
  if (!d.mode) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) { return; }
    if (dx > 0 && Math.abs(dx) > Math.abs(dy) * 1.2 && (STACK.length > 1 || WIDE.matches)) { d.mode = STACK.length > 1 ? 'back' : 'side'; }
    else if (dy > 0 && Math.abs(dy) > Math.abs(dx) && !WIDE.matches && (!d.inBody || d.body.scrollTop <= 0)) { d.mode = 'down'; }
    else { d.mode = 'no'; return; }
    d.el = d.mode === 'back' ? d.pane : d.sheet;
    d.el.classList.add('dragging');
    d.scrim = panel.querySelector('.scrim');
    d.scrim.style.transition = 'none';
  }
  e.preventDefault();
  const pos = Math.max(0, d.mode === 'down' ? dy : dx);
  if (e.timeStamp > d.lt) { d.v = (pos - d.last) / (e.timeStamp - d.lt); }
  d.last = pos; d.lt = e.timeStamp;
  d.el.style.transform = d.mode === 'down' ? 'translateY(' + pos + 'px)' : 'translateX(' + pos + 'px)';
  if (d.mode !== 'back') { d.scrim.style.opacity = String(Math.max(0, 1 - pos / (d.mode === 'down' ? d.sheet.offsetHeight : d.sheet.offsetWidth))); }
}, { passive: false });
function endDrag(e) {
  const d = drag;
  drag = null;
  if (!d || !d.el) { return; }
  const size = d.mode === 'down' ? d.sheet.offsetHeight : d.sheet.offsetWidth;
  const go = e.type === 'touchend' && (d.last > size * .3 || (d.last > 40 && d.v > .4));
  d.el.classList.remove('dragging');
  d.scrim.style.transition = '';
  if (!go) { d.el.style.transform = ''; d.scrim.style.opacity = ''; return; }   // springs back
  const finish = function () { if (d.mode === 'back') { goBack(); } else { closing = false; closePanel(true); } };
  if (d.mode !== 'back') { d.scrim.style.opacity = '0'; closing = true; }
  if (REDUCED()) { finish(); return; }
  d.el.style.transform = d.mode === 'down' ? 'translateY(100%)' : 'translateX(100%)';
  setTimeout(finish, T_OUT);
}
panel.addEventListener('touchend', endDrag);
panel.addEventListener('touchcancel', endDrag);

/* ---------- a one-time hint for a gesture: once per phone, gone after 4 seconds or the first try ---------- */
const HINTS = {};
function seen(key) { try { return localStorage.getItem('offenceDemo.hint.' + key) === '1'; } catch (err) { return false; } }
function hint(key, host, html) {
  if (!COARSE.matches || HINTS[key] || seen(key)) { return null; }
  try { localStorage.setItem('offenceDemo.hint.' + key, '1'); } catch (err) { /* without storage it shows again next visit */ }
  const h = document.createElement('div');
  h.className = 'hint';
  h.setAttribute('role', 'status');
  h.innerHTML = html;
  host.appendChild(h);
  HINTS[key] = h;
  h.timer = setTimeout(function () { hideHint(key); }, 4000);
  return h;
}
function hideHint(key) {
  const h = HINTS[key];
  if (!h || h.gone) { return; }
  h.gone = true;
  clearTimeout(h.timer);
  h.classList.add('out');
  setTimeout(function () { h.remove(); }, 300);
  if (key === 'swipe') { watchHoldHint(); }
}
// the hold hint waits for the swipe hint to finish, then shows when the Top 5 comes into view
let holdIO = null;
function watchHoldHint() {
  if (holdIO) { holdIO.disconnect(); holdIO = null; }
  if (!COARSE.matches || HINTS.hold || seen('hold') || !('IntersectionObserver' in window)) { return; }
  if (HINTS.swipe ? !HINTS.swipe.gone : !seen('swipe')) { return; }
  const row = document.querySelector('#rest button.t5[data-id]');
  if (!row) { return; }
  const box = row.closest('.card');
  holdIO = new IntersectionObserver(function (en) {
    if (!en[0].isIntersecting) { return; }
    holdIO.disconnect(); holdIO = null;
    box.classList.add('hint-host');
    hint('hold', box, 'Hold a row for a quick look');
  }, { threshold: .7 });
  holdIO.observe(box);
}

/* ---------- press and hold a Top 5 row or a student: a peek; letting go closes it, a tap still opens the panel ---------- */
const peek = document.getElementById('peek'), HOLD_MS = 450, SLOP = 10;
let hold = null, peekRow = null, swallow = null;
function peekHtml(row) {
  if (row.classList.contains('stu')) {
    const st = stats(+row.getAttribute('data-v')), hd = studentHead(st), sm = studentSummary(st);
    return '<div class="pk-h"><b>' + hd.title + '</b><span>' + hd.sub + '</span></div><p>' + sm.count + '</p><p>' + sm.clean + '</p>';
  }
  const v = REG[+row.getAttribute('data-id')];
  return '<div class="pk-h"><b>' + v.title + '</b><span>' + v.sub + '</span></div>' + levelStrip(v.list);
}
function showPeek(row) {
  peekRow = row;
  row.classList.add('held');
  peek.innerHTML = peekHtml(row);
  peek.hidden = false;
  const box = row.closest('.card').getBoundingClientRect(), r = row.getBoundingClientRect();
  peek.style.left = (box.left + 6) + 'px';
  peek.style.width = (box.width - 12) + 'px';
  if (r.top + r.height / 2 > innerHeight / 2) { peek.style.top = ''; peek.style.bottom = (innerHeight - r.top + 8) + 'px'; }   // above a low row
  else { peek.style.bottom = ''; peek.style.top = (r.bottom + 8) + 'px'; }                                                 // below a high one
  hideHint('hold');
}
function hidePeek() {
  if (!peekRow) { return; }
  peekRow.classList.remove('held');
  peekRow = null;
  peek.hidden = true;
  peek.innerHTML = '';
}
function endHold(e) {
  if (!hold || (e && e.pointerId !== hold.id)) { return; }
  clearTimeout(hold.t);
  if (peekRow) { swallow = { row: peekRow, at: Date.now() }; hidePeek(); }
  hold = null;
}

/* ---------- the year: a swipe on the headline, the switcher, or ← → ---------- */
let swipe, panes, segBtns, step = 1, target = null, touching = false, settleT = 0, frame = 0;
function measure() { step = panes[1].offsetLeft - panes[0].offsetLeft || 1; }
function idxAt() { return Math.max(0, Math.min(YEARS.length - 1, Math.round(swipe.scrollLeft / step))); }
function paintSeg(i) { segBtns.forEach(function (b, k) { b.classList.toggle('on', k === i); b.setAttribute('aria-pressed', String(YEARS[k] === S.year)); }); }
function setPanes() { panes.forEach(function (p, i) { p.inert = YEARS[i] !== S.year; }); }   // only the year in view takes focus
function fitHeight() {                           // the headline is as tall as the panel(s) in view, so no gap opens under a short year
  const n = YEARS.length - 1, f = Math.min(n, Math.max(0, swipe.scrollLeft / step)), a = Math.floor(f), b = Math.ceil(f);
  swipe.style.height = Math.max(panes[a].offsetHeight, panes[b].offsetHeight) + 'px';
  // a neighbour's caption fades out, so only the edges of its boxes show beside the year in view; with a mouse
  // there is nothing to swipe, so the neighbours fade out entirely and only show while gliding to another year
  panes.forEach(function (p, i) {
    const d = Math.abs(i - f);
    p.style.opacity = FINE.matches ? String(Math.max(0, 1 - d)) : '';
    Array.prototype.forEach.call(p.querySelectorAll('.cap,.infonote'), function (x) { x.style.opacity = String(Math.max(0, 1 - d * 1.5)); });
  });
}
function setYear(y) {
  if (y === S.year) { return; }
  const hadFocus = swipe.contains(document.activeElement);
  S.year = y; S.all = false;
  paintSeg(YEARS.indexOf(y));
  setPanes();
  renderRest(true);
  if (hadFocus) { segBtns[YEARS.indexOf(y)].focus({ preventScroll: true }); }
  hideHint('swipe');
}
function pickYear(y) {                           // from the switcher or a key: glide to that year's panel
  const i = YEARS.indexOf(y);
  if (i < 0) { return; }
  target = Math.abs(swipe.scrollLeft - i * step) > 1 ? i : null;
  setYear(y);
  if (target !== null) { swipe.scrollTo({ left: i * step, behavior: REDUCED() ? 'auto' : 'smooth' }); }
}
function settle() {                              // a swipe has come to rest on a panel: that is the year
  clearTimeout(settleT);
  if (touching) { return; }
  const i = idxAt();
  if (Math.abs(swipe.scrollLeft - i * step) > 2) { swipe.scrollTo({ left: i * step, behavior: REDUCED() ? 'auto' : 'smooth' }); return; }
  target = null;
  setYear(YEARS[i]);
  paintSeg(i);
  fitHeight();
}

/* ---------- one handler for every tap ---------- */
document.addEventListener('click', function (e) {          // letting go of a peek is not a tap
  if (swallow && Date.now() - swallow.at < 700 && swallow.row.contains(e.target)) { e.preventDefault(); e.stopImmediatePropagation(); }
  swallow = null;
}, true);
document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT' || closing) { return; }
  const act = t.getAttribute('data-act');
  if (act === 'year') { pickYear(+t.getAttribute('data-v')); }
  else if (act === 'open') { openView(REG[+t.getAttribute('data-id')], t); }
  else if (act === 'stu') { openView({ kind: 'student', sid: +t.getAttribute('data-v') }, t); }
  else if (act === 'who') { pushStudent(+t.getAttribute('data-v')); }
  else if (act === 'back') { goBack(); }
  else if (act === 'close') { closePanel(); }
  else if (act === 'more') { S.all = !S.all; renderRest(); main.querySelector('[data-act="more"]').focus({ preventScroll: true }); }
  else if (act === 'info') {
    S.info = !S.info;
    t.setAttribute('aria-expanded', String(S.info));
    document.getElementById('lag').hidden = !S.info;
    fitHeight();
  }
});
document.addEventListener('change', function (e) {
  if (e.target.matches && e.target.matches('[data-act="pick"]')) { S.pick = e.target.value; renderRest(); main.querySelector('[data-act="pick"]').focus({ preventScroll: true }); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && STACK.length) { closePanel(); return; }
  if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) { return; }
  const tg = e.target;
  if (tg && (tg.tagName === 'SELECT' || tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) { return; }
  if (STACK.length) { if (e.key === 'ArrowLeft' && STACK.length > 1) { e.preventDefault(); goBack(); } return; }
  const i = YEARS.indexOf(S.year) + (e.key === 'ArrowLeft' ? -1 : 1);
  if (i >= 0 && i < YEARS.length) { e.preventDefault(); pickYear(YEARS[i]); }
});

/* ---------- start ---------- */
document.getElementById('ver').textContent = 'v' + APP_VERSION.replace(/\.0$/, '');
document.title = APP_DISPLAY_NAME + ' · v' + APP_VERSION.replace(/\.0$/, '');
renderHead();
swipe = document.getElementById('swipe');
panes = Array.prototype.slice.call(swipe.querySelectorAll('.yp'));
segBtns = Array.prototype.slice.call(main.querySelectorAll('[data-act="year"]'));
const restEl = document.getElementById('rest');
renderRest();
measure();
swipe.scrollLeft = YEARS.indexOf(S.year) * step;
setPanes();
fitHeight();

swipe.addEventListener('scroll', function () {
  if (!frame) { frame = requestAnimationFrame(function () { frame = 0; paintSeg(target !== null ? target : idxAt()); fitHeight(); }); }
  clearTimeout(settleT);
  settleT = setTimeout(settle, 150);
}, { passive: true });
swipe.addEventListener('scrollend', settle);
swipe.addEventListener('touchstart', function () { touching = true; target = null; }, { passive: true });
['touchend', 'touchcancel'].forEach(function (n) { swipe.addEventListener(n, function () { touching = false; clearTimeout(settleT); settleT = setTimeout(settle, 150); }, { passive: true }); });
if ('ResizeObserver' in window) {                // fonts arriving, the note opening, or a turned phone
  let lastW = swipe.clientWidth;
  const ro = new ResizeObserver(function () {
    measure();
    if (swipe.clientWidth !== lastW) { lastW = swipe.clientWidth; if (!touching) { swipe.scrollLeft = YEARS.indexOf(S.year) * step; } }
    fitHeight();
  });
  panes.forEach(function (p) { ro.observe(p); });
}

restEl.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' || !e.isPrimary) { return; }
  const row = e.target.closest('button.t5[data-id], button.stu');
  if (!row) { return; }
  endHold();
  hold = { row: row, id: e.pointerId, x: e.clientX, y: e.clientY, t: setTimeout(function () { showPeek(row); }, HOLD_MS) };
});
document.addEventListener('pointermove', function (e) {
  if (hold && !peekRow && e.pointerId === hold.id && Math.abs(e.clientX - hold.x) + Math.abs(e.clientY - hold.y) > SLOP) { endHold(e); }
}, { passive: true });
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
restEl.addEventListener('touchmove', function (e) { if (peekRow) { e.preventDefault(); } }, { passive: false });   // the page holds still under a peek
restEl.addEventListener('contextmenu', function (e) { if (e.target.closest('button.t5, button.stu')) { e.preventDefault(); } });

if (hint('swipe', swipe.parentNode, '<span aria-hidden="true">&larr;</span>Swipe to change the year<span aria-hidden="true">&rarr;</span>') && !REDUCED()) {
  swipe.classList.add('nudge');
  setTimeout(function () { swipe.classList.remove('nudge'); }, 1800);
}
watchHoldHint();
})();
</script>

</body>
