<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Practice · Students picker</title>
<style id="base">
  body { margin: 0; background: #f4f6f8; color: #1f2933; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .practice-banner { background: #fff4d6; border-bottom: 2px dashed #c98a00; padding: 10px 20px; font-size: 14px; }
  .practice-banner b { color: #8a5a00; }
</style>
</head>
<body>
<div class="practice-banner"><b>Practice page.</b> Every name here is invented. It behaves like the Students box on Parents Gateway's Create Announcement screen, so you can try a script on it safely.</div>
<div id="app"></div>
<script>
(function () {
  
  var seed = 20261024;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  var CN_SUR = ["TAN", "LIM", "LEE", "NG", "ONG", "WONG", "GOH", "CHUA", "CHAN", "KOH", "TEO", "ANG", "YEO", "TAY", "HO", "LOW", "TOH", "SIM", "CHONG", "CHIA", "SEAH", "QUEK", "PHUA", "LAU"];
  var CN_SYL = ["WEI", "MING", "JIA", "HUI", "XIN", "YI", "JUN", "JIE", "KAI", "XUAN", "YU", "TING", "ZHI", "HAO", "MIN", "JING", "WEN", "SHU", "EN", "QI", "RUI", "LE", "ZI", "YANG", "KE", "YONG", "LIANG", "HUA", "LING", "FENG"];
  var MY_M = ["MUHAMMAD IRFAN", "MUHAMMAD HAZIQ", "AHMAD FARHAN", "MUHAMMAD DANIAL", "ADAM HAKIMI", "AMIRUL HAKIM", "MUHAMMAD RAYYAN", "IMRAN HAIKAL"];
  var MY_F = ["NUR AISYAH", "SITI NURHALIZA", "NUR ALYA", "NURUL IZZAH", "SITI SARAH", "NUR QISTINA", "AQILAH HUMAIRA", "NUR DAMIA"];
  var MY_FATHER = ["RAHMAN", "ISMAIL", "OSMAN", "HASSAN", "IBRAHIM", "YUSOF", "SALLEH", "KAMAL", "RAZAK", "MANSOR"];
  var IN_GIV = ["ARJUN", "PRIYA", "KAVYA", "RAHUL", "DIVYA", "VIKRAM", "MEERA", "SANJAY", "NISHA", "ARVIND", "LAKSHMI", "KARTHIK"];
  var IN_FAM = ["RAJAN", "KUMAR", "SUBRAMANIAM", "PILLAI", "NAIR", "KRISHNAN", "MUTHU", "GOPAL", "RAMAN", "SELVAM"];
  var EU = ["ETHAN DE SOUZA", "CHLOE PEREIRA", "RYAN FERNANDEZ", "SOPHIE D'CRUZ", "LUCAS RODRIGUES", "HANNAH GOMES"];
  var CLASSES = [];
  [1, 2, 3, 4].forEach(function (lv) { for (var c = 1; c <= 7; c++) { CLASSES.push(lv + "E" + c); } });
  var seen = {}, STUDENTS = [];
  function add(name, cls) { STUDENTS.push({ name: name, cls: cls }); seen[name] = (seen[name] || 0) + 1; }
  for (var guard = 0; STUDENTS.length < 1040 && guard < 100000; guard++) {
    var r = rnd(), name;
    if (r < 0.62) { var a1 = pick(CN_SYL), a2 = pick(CN_SYL); if (a1 === a2) { continue; } name = pick(CN_SUR) + " " + a1 + " " + a2; }
    else if (r < 0.80) { name = rnd() < 0.5 ? pick(MY_M) + " BIN " + pick(MY_FATHER) : pick(MY_F) + " BINTE " + pick(MY_FATHER); }
    else if (r < 0.96) { name = pick(IN_GIV) + " " + pick(IN_FAM); }
    else { name = pick(EU); }
    if (seen[name]) { continue; }
    add(name, pick(CLASSES));
  }
  [["TAN WEI MING", "3E1"], ["LIM JIA HUI", "2E3"], ["NG XIN YI", "1E4"]].forEach(function (p) { if (!seen[p[0]]) { add(p[0], p[1]); } });
  add("TAN WEI MING", "4E3");
  add("LIM JIA HUI ROSE", "2E5");
  add("NG XIN YI CLARE", "1E2");
  STUDENTS.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : a.cls < b.cls ? -1 : 1; });

  
  function code() { var s = "sc-"; for (var i = 0; i < 6; i++) { s += "abcdefghijkLMNOPQRSTuvwxyz"[Math.floor(Math.random() * 26)]; } return s; }
  var K = {}; ["page", "card", "head", "tabs", "tab", "on", "field", "tags", "tag", "x", "box", "menu", "item", "nm", "desc", "pad", "count", "hint", "foot", "btn"].forEach(function (k) { K[k] = code(); });
  var css = "." + K.page + "{max-width:760px;margin:24px auto;padding:0 16px}" +
    "." + K.card + "{background:#fff;border:1px solid #d8dee4;border-radius:10px;padding:18px 20px}" +
    "." + K.head + "{font-size:20px;font-weight:600;margin:0 0 14px}" +
    "." + K.tabs + "{display:flex;gap:4px;margin-bottom:8px}" +
    "." + K.tab + "{padding:5px 14px;border:1px solid #c9d1d9;border-radius:16px;font-size:13px;cursor:pointer;user-select:none}" +
    "." + K.on + "{background:#1f2933;color:#fff;border-color:#1f2933}" +
    "." + K.field + "{border:1px solid #9aa5b1;border-radius:8px;padding:6px;position:relative}" +
    "." + K.tags + "{display:flex;flex-wrap:wrap;gap:6px}" +
    "." + K.tag + "{display:inline-flex;align-items:center;gap:4px;background:#e3edf7;border-radius:14px;padding:2px 4px 2px 10px;font-size:13px}" +
    "." + K.x + "{border:0;background:none;cursor:pointer;font-size:14px;color:#52606d;padding:0 6px}" +
    "." + K.box + "{border:0;outline:0;font:inherit;min-width:220px;flex:1;padding:4px}" +
    "." + K.menu + "{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #c9d1d9;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);height:" + (5 * 44) + "px;overflow-y:auto;z-index:5;list-style:none;padding:0}" +
    "." + K.item + "{height:44px;box-sizing:border-box;padding:5px 12px;border-bottom:1px solid #eef1f4;cursor:pointer;position:absolute;left:0;right:0}" +
    "." + K.item + ":hover{background:#f0f6fc}" +
    "." + K.nm + "{font-size:14px;line-height:1.3}" +
    "." + K.desc + "{font-size:12px;color:#7b8794;line-height:1.3}" +
    "." + K.count + "{margin-top:10px;font-size:13px;color:#52606d}" +
    "." + K.hint + "{font-size:13px;color:#7b8794;margin:8px 0 0}" +
    "." + K.foot + "{margin-top:18px;display:flex;justify-content:flex-end}" +
    "." + K.btn + "{background:#1f2933;color:#fff;border:0;border-radius:8px;padding:9px 18px;font:600 14px inherit;cursor:pointer}";
  var st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  
  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="' + K.page + '"><div class="' + K.card + '">' +
      '<h1 class="' + K.head + '">Create announcement · Recipients</h1>' +
      '<div class="' + K.tabs + '"><span class="combobox__tab ' + K.tab + ' ' + K.on + '">Student</span><span class="combobox__tab ' + K.tab + '">Class</span></div>' +
      '<div class="combobox ' + K.field + '"><div class="' + K.tags + '"><input class="combobox__search ' + K.box + '" placeholder="Search by name or class" autocomplete="off"></div>' +
      '<ul class="combobox__menu ' + K.menu + '" hidden></ul></div>' +
      '<div class="' + K.count + '"></div>' +
      '<p class="' + K.hint + '">' + STUDENTS.length + ' students in this practice school.</p>' +
      '<div class="' + K.foot + '"><button type="button" class="' + K.btn + '">Next</button></div>' +
    '</div></div>';
  var box = app.querySelector(".combobox__search"), menu = app.querySelector(".combobox__menu");
  var tags = box.parentNode, countEl = app.querySelector("." + K.count);
  var picked = [];      // indexes into STUDENTS
  var shown = [];       // the filtered list; only 5 of it is ever on the page
  var ROW = 44, WINDOW = 5;

  function updateCount() { countEl.textContent = picked.length ? picked.length + " student" + (picked.length > 1 ? "s" : "") + " picked" : "Nobody picked yet"; }
  function drawTags() {
    tags.querySelectorAll(".combobox__tag").forEach(function (t) { t.remove(); });
    picked.forEach(function (ix) {
      var t = document.createElement("span");
      t.className = "combobox__tag " + K.tag;
      t.innerHTML = '<span class="combobox__tag-label">' + STUDENTS[ix].name + '</span><button type="button" class="' + K.x + '" aria-label="Remove">&times;</button>';
      t.querySelector("button").addEventListener("mousedown", function (e) { e.preventDefault(); picked = picked.filter(function (p) { return p !== ix; }); drawTags(); draw(); });
      tags.insertBefore(t, box);
    });
    updateCount();
  }

  
  function draw() {
    var top = Math.floor(menu.scrollTop / ROW);
    menu.innerHTML = '<li aria-hidden="true" style="height:' + (shown.length * ROW) + 'px;list-style:none;border:0;padding:0"></li>';
    for (var i = top; i < Math.min(shown.length, top + WINDOW); i++) {
      var s = STUDENTS[shown[i]];
      var li = document.createElement("li");
      li.className = "combobox__item " + K.item;
      li.style.top = (i * ROW) + "px";
      li.innerHTML = '<div class="' + K.nm + '">' + s.name + '</div><div class="' + K.desc + '">' + s.cls + ' · Practice Secondary</div>';
      li.dataset.ix = shown[i];
      li.addEventListener("mousedown", function (e) {
        e.preventDefault();
        var ix = +this.dataset.ix;
        if (picked.indexOf(ix) < 0) { picked.push(ix); drawTags(); }
      });
      menu.appendChild(li);
    }
    if (!shown.length) { menu.innerHTML = '<li class="' + K.item + '" style="top:0;cursor:default">No student matches</li>'; }
  }
  var timer = 0;
  function filter() {
    var q = box.value.trim().toUpperCase();
    shown = [];
    STUDENTS.forEach(function (s, i) { if (picked.indexOf(i) < 0 && (!q || s.name.indexOf(q) >= 0 || s.cls === q)) { shown.push(i); } });
    menu.scrollTop = 0;
    draw();
  }
  box.addEventListener("focus", function () { menu.hidden = false; filter(); });
  box.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(filter, 180); });
  menu.addEventListener("scroll", draw);
  box.addEventListener("blur", function () { setTimeout(function () { box.value = ""; menu.hidden = true; menu.innerHTML = ""; }, 0); });
  app.querySelectorAll(".combobox__tab").forEach(function (t) {
    t.addEventListener("mousedown", function (e) { e.preventDefault(); app.querySelectorAll(".combobox__tab").forEach(function (x) { x.classList.remove(K.on); }); t.classList.add(K.on); });
  });
  updateCount();
})();
</script>
</body>
</html>
